# Telegen v3.0 Service
# Task: DEP-008
{{ $snmpCfg := (default (dict) .Values.collector.snmp) -}}
{{- $snmpTraps := (default (dict) (get $snmpCfg "traps")) -}}
{{- $snmpTrapReceiver := (default (dict) (get $snmpCfg "trapReceiver")) -}}
{{- $snmpTrapEnabled := false -}}
{{- if hasKey $snmpTraps "enabled" -}}
{{- $snmpTrapEnabled = (get $snmpTraps "enabled") -}}
{{- else if hasKey $snmpTrapReceiver "enabled" -}}
{{- $snmpTrapEnabled = (get $snmpTrapReceiver "enabled") -}}
{{- end -}}
{{- $snmpTrapPort := 1162 -}}
{{- if hasKey $snmpTraps "port" -}}
{{- $snmpTrapPort = (get $snmpTraps "port") -}}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telegen.fullname" . }}
  namespace: {{ include "telegen.namespace" . }}
  labels:
    {{- include "telegen.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.mode "agent" }}
  clusterIP: None
  {{- end }}
  selector:
    {{- include "telegen.selectorLabels" . | nindent 4 }}
    {{- if eq .Values.mode "agent" }}
    app.kubernetes.io/component: agent
    {{- else }}
    app.kubernetes.io/component: collector
    {{- end }}
  ports:
    - name: http-metrics
      port: {{ .Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
    {{- if and (eq .Values.mode "agent") .Values.kubeMetrics.enabled }}
    - name: kube-metrics
      port: 9443
      targetPort: kube-metrics
      protocol: TCP
    {{- end }}
    {{- if and (eq .Values.mode "collector") $snmpTrapEnabled }}
    - name: snmp-traps
      port: 162
      targetPort: {{ $snmpTrapPort }}
      protocol: UDP
    {{- end }}
