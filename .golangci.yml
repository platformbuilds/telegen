version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - copyloopvar
    - forbidigo
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: true
    govet:
      enable:
        - copylocks
    forbidigo:
      forbid:
        - pattern: 'regexp\.MustCompile\(\s*[^"`]'
          msg: "use a literal regexp.MustCompile argument (precompile at package scope)"
        - pattern: 'regexp\.Compile\(\s*[^"`]'
          msg: "use a literal regexp.Compile argument (precompile/cache patterns)"
        - pattern: 'context\.Background\(\)'
          msg: "use a propagated context; context.Background is only allowed in main and tests"
        - pattern: '\blog\.(Fatal|Fatalf)\('
          msg: "avoid process-fatal logging outside main/tests"
        - pattern: '\bos\.Exit\('
          msg: "avoid process exits outside main/tests"
    staticcheck:
      checks:
        - all
        - -QF*    # Disable quickfix suggestions
        - -ST*    # Disable style suggestions
        - -SA9003 # Allow empty branches
        - -SA1019 # Allow deprecated functions
        - -S1008  # Allow if/return instead of direct return
  exclusions:
    rules:
      # Ignore errcheck and unused in test files
      - path: _test\.go
        linters:
          - errcheck
          - unused
          - forbidigo
          - bodyclose
      # main entrypoints are the only allowed production sites for process exit
      # and root context construction.
      - path: ^cmd/.*/main\.go
        linters:
          - forbidigo
      # Ignore errcheck for defer statements
      - source: "defer .*\\.Close\\(\\)"
        linters:
          - errcheck
      - source: "defer .*\\.Stop\\(\\)"
        linters:
          - errcheck
      # Ignore in dev directory (prototype code)
      - path: ^dev/
        linters:
          - errcheck
          - unused
          - staticcheck
          - ineffassign
      # Ignore errcheck in queue (disk operations may fail on cleanup)
      - path: internal/queue/
        linters:
          - errcheck
      # Ignore unused in internal packages (may be used in build constrained files)
      - path: ^internal/
        linters:
          - unused
      # Ignore ineffassign in prometheus adapter (parser pattern)
      - path: prometheus_adapter\.go
        linters:
          - ineffassign
