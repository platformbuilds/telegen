#     topics:
#       - "app-logs"

# Optional VMware vSphere collector section
vmware:
  enabled: false
  collect_interval: 60s
  granularity: 20
  interval: 20
  insecure_tls: true
  targets: []
  collectors:
    datacenter: true
    cluster: true
    datastore: true
    host: true
    vm: true
    esxcli_host_nic: false
    esxcli_storage: false
  events:
    enabled: true
    state_changes: true
    max_per_poll: 100
  extra_labels: {}
