
name:                     FPolicySVM
query:                    api/cluster/counter/tables/fpolicy
object:                   fpolicy_svm

counters:
  - ^^instance_name             => svm
  - aborted_requests             => aborted_requests
  - cifs_requests                => cifs_requests
  - failedop_notifications       => failedop_notifications
  - io_processing_latency        => io_processing_latency
  - io_thread_wait_latency       => io_thread_wait_latency

export_options:
  instance_keys:
    - svm
